<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="color-scheme" content="dark">
<style>html,body{background:#050612;color:#e5e7eb}html{color-scheme:dark}</style>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/header.css">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title data-i18n-title="meta.titleCompte">Compte - Les Aventuriers du Lys</title>
<style>
  :root{
    --bg0:#050612; --text:#e5e7eb; --muted:#94a3b8; --line:rgba(148,163,184,.18);
    --accent:#22d3ee; --accent2:#a78bfa; --gold:#fbbf24;
    --panel:rgba(10,15,30,.78); --panel2:rgba(15,23,42,.88);
    --radius2:22px; --shadow: 0 18px 45px rgba(0,0,0,.55);
    --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    --fontDisplay: ui-serif, Georgia, "Times New Roman", Times, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font); color:var(--text); line-height:1.55;
    background:
      linear-gradient(rgba(5,6,18,.28), rgba(5,6,18,.70)),
      url("table-fantasy.png"),
      linear-gradient(180deg, #0b1230, var(--bg0));
    background-size:cover; background-position:center; background-attachment:fixed;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none}
  .wrap{max-width:520px;margin:0 auto;padding:18px}
  header{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:linear-gradient(to bottom, rgba(5,6,18,.85), rgba(5,6,18,.55), transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:12px}
  .sigil{
    width:40px;height:40px;border-radius:999px;
    background:radial-gradient(circle at 35% 25%, #ffffff, rgba(251,191,36,.85) 38%, rgba(167,139,250,.55) 62%, rgba(34,211,238,.35) 85%);
    box-shadow:0 0 18px rgba(34,211,238,.22); border:1px solid rgba(148,163,184,.35);
  }
  .brand h1{font-size:14px;letter-spacing:.08em;text-transform:uppercase}
  .brand p{font-size:12px;color:var(--muted);margin-top:-2px}
  .nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .chip{
    padding:8px 12px;border-radius:999px;border:1px solid rgba(148,163,184,.28);
    background:rgba(2,6,23,.48);color:var(--muted);font-size:13px
  }
  .langBtn{
    padding:8px 12px;border-radius:999px;
    border:1px solid rgba(148,163,184,.28);
    background:rgba(2,6,23,.55);
    color:var(--text);cursor:pointer;font-size:13px;font-weight:900;
  }
  .card{
    margin-top:24px;background:var(--panel);border:1px solid rgba(148,163,184,.22);
    border-radius:var(--radius2);box-shadow:var(--shadow);padding:22px;
  }
  .kicker{color:rgba(34,211,238,.95);text-transform:uppercase;letter-spacing:.18em;font-size:12px;margin-bottom:10px}
  h2{font-family:var(--fontDisplay);font-size:28px;margin-bottom:10px}
  h2 span[data-i18n$="Highlight"]{background:linear-gradient(to right, var(--gold), var(--accent2), var(--accent));-webkit-background-clip:text;color:transparent}
  .lead{color:var(--muted);font-size:14px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{
    padding:8px 12px;border-radius:999px;border:1px solid rgba(148,163,184,.25);
    background:rgba(2,6,23,.45);color:var(--text);cursor:pointer;font-weight:900;font-size:13px
  }
  .tab.active{border-color:rgba(34,211,238,.65);box-shadow:0 0 0 3px rgba(34,211,238,.10)}
  label{display:block;color:var(--muted);font-size:12px;margin:10px 0 6px 2px}
  input, select{
    width:100%;padding:10px;border-radius:12px;border:1px solid rgba(148,163,184,.25);
    background:rgba(2,6,23,.55);color:var(--text);outline:none
  }
  .btnPrimary{
    width:100%;margin-top:16px;padding:12px;border-radius:12px;border:0;
    background:linear-gradient(135deg, var(--accent), var(--accent2), var(--gold));
    color:#06101f;cursor:pointer;font-weight:950
  }
  .msg{margin-top:12px;font-size:13px;display:none}
  .msg.err{color:#fecaca}
  .msg.ok{color:#bbf7d0}
</style>
</head>
<body class="adl-theme">
<div data-site-header></div>

<main class="wrap">
  <section class="card">
    <div class="kicker" data-i18n="compte.kicker">Accès sécurisé</div>
    <h2><span data-i18n="compte.titleBefore">Votre</span> <span data-i18n="compte.titleHighlight">compte</span></h2>
    <p class="lead" data-i18n="compte.lead">Connectez-vous pour réserver une place, publier une partie ou gérer votre profil.</p>

    <div class="tabs">
      <button class="tab active" type="button" id="tabLogin" data-i18n="compte.tabLogin">Connexion</button>
      <button class="tab" type="button" id="tabRegister" data-i18n="compte.tabRegister">Créer un compte</button>
    </div>

    <form id="formLogin">
      <label data-i18n="compte.email">Courriel</label>
      <input id="loginEmail" type="email" required autocomplete="username" />
      <label data-i18n="compte.password">Mot de passe</label>
      <input id="loginPassword" type="password" required minlength="8" autocomplete="current-password" />
      <button class="btnPrimary" type="submit" data-i18n="compte.submitLogin">Se connecter</button>
    </form>

    <form id="formRegister" style="display:none">
      <label data-i18n="compte.displayName">Pseudo public</label>
      <input id="regName" required maxlength="80" />
      <label data-i18n="compte.email">Courriel</label>
      <input id="regEmail" type="email" required autocomplete="username" />
      <label data-i18n="compte.passwordMin">Mot de passe (min. 8)</label>
      <input id="regPassword" type="password" required minlength="8" autocomplete="new-password" />
      <label data-i18n="compte.role">Je suis plutôt…</label>
      <select id="regRole">
        <option value="player" data-i18n="compte.rolePlayer">Joueur</option>
        <option value="gm" data-i18n="compte.roleGm">Maître de jeu</option>
        <option value="both" data-i18n="compte.roleBoth">Les deux</option>
      </select>
      <button class="btnPrimary" type="submit" data-i18n="compte.submitRegister">Créer mon compte</button>
    </form>

    <div class="msg" id="msg"></div>
  </section>
</main>

<script src="/js/api.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/nav.js"></script>
<script>
(async function () {
  await ADL.readyI18n;

  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  const mode = params.get('mode');

  const tabLogin = document.getElementById('tabLogin');
  const tabRegister = document.getElementById('tabRegister');
  const formLogin = document.getElementById('formLogin');
  const formRegister = document.getElementById('formRegister');
  const msg = document.getElementById('msg');

  function show(which){
    const isLogin = which === 'login';
    formLogin.style.display = isLogin ? 'block' : 'none';
    formRegister.style.display = isLogin ? 'none' : 'block';
    tabLogin.classList.toggle('active', isLogin);
    tabRegister.classList.toggle('active', !isLogin);
    msg.style.display = 'none';
  }

  tabLogin.onclick = () => show('login');
  tabRegister.onclick = () => show('register');
  if (mode === 'register') show('register');

  function flash(text, ok){
    msg.textContent = text;
    msg.className = 'msg ' + (ok ? 'ok' : 'err');
    msg.style.display = 'block';
  }

  formLogin.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await ADL.api('/auth/login', {
        method: 'POST',
        body: {
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value
        }
      });
      location.href = next;
    } catch (err) {
      flash(ADL.errorMessage(err), false);
    }
  });

  formRegister.addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await ADL.api('/auth/register', {
        method: 'POST',
        body: {
          display_name: document.getElementById('regName').value,
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          role: document.getElementById('regRole').value
        }
      });
      location.href = next;
    } catch (err) {
      flash(ADL.errorMessage(err), false);
    }
  });

  ADL.me().then((u) => { if (u) location.href = next; });
})();
</script>
</body>
</html>
